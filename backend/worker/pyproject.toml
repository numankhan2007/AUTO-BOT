[project]
name = "auto-bot-01"
version = "3.0.0"
description = "Shadow System Instagram Bot — Cloudflare Python Worker"
requires-python = ">= 3.12"

# No external runtime dependencies — the Worker uses:
#   - js.fetch (built-in FFI to Workers fetch API)
#   - json, hmac, hashlib, urllib.parse (Python stdlib)
dependencies = []

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
