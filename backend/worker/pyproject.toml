[project]
name = "auto-bot-01"
version = "3.0.0"
description = "Shadow System Instagram Bot — Cloudflare Python Worker"
requires-python = ">= 3.13"

# Runtime dependency — workers-py provides the `workers` module
# that pywrangler bundles into the deployed Worker.
# js.fetch, json, hmac, hashlib, urllib.parse are Python stdlib / FFI built-ins.
dependencies = [
    "workers-py>=1.90.0",
]

[dependency-groups]
dev = [
    "workers-runtime-sdk",
]
