# ── wrangler.toml — Shadow System Cloudflare Python Worker ──
# Deployment config for pywrangler CLI.

name = "shadow-system"
main = "main.py"
compatibility_date = "2026-04-28"
compatibility_flags = ["python_workers"]

# ── Static Assets (React Frontend) ──
# The ASSETS binding serves the Vite-built React app.
# Path is relative to THIS file (backend/worker/wrangler.toml).
[assets]
directory = "../../frontend/dist"

# ── Environment Variables & Secrets ──
# Set secrets via: npx wrangler secret put <KEY_NAME>
# Required secrets:
#   APP_SECRET
#   BOT_USERNAME
#   GEMINI_KEY
#   INSTA_TOKEN
#   INSTAGRAM_ACCOUNT_ID
#   VERIFY_TOKEN

# ── Observability (Logs & Traces) ──
[observability]
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false
