# ── wrangler.toml — Shadow System Worker Configuration ──
# Deploy with: cd backend/worker && uv run pywrangler deploy

name = "auto-bot-01"                           # Must match the deployed Worker name in Cloudflare Dashboard
main = "main.py"
compatibility_date = "2026-04-27"
compatibility_flags = ["python_workers"]

# ── Static Assets (React Frontend) ──
# Serves the built Vite output from frontend/dist/.
# With binding = "ASSETS", ALL requests hit the Worker first.
# The Worker calls self.env.ASSETS.fetch(request) for non-API routes.
[assets]
directory = "../../frontend/dist"              # Relative to this wrangler.toml file
binding = "ASSETS"                             # Exposes self.env.ASSETS in Python Worker

# ── Observability (enables stored/searchable logs in dashboard) ──
[observability]
enabled = true

# ── Secrets (set via Dashboard or CLI, NEVER hardcoded here) ──
# Dashboard: Workers & Pages → auto-bot-01 → Settings → Variables and Secrets
# CLI alternative:
#   npx wrangler secret put VERIFY_TOKEN
#   npx wrangler secret put APP_SECRET
#   npx wrangler secret put INSTA_TOKEN
#   npx wrangler secret put INSTAGRAM_ACCOUNT_ID
#   npx wrangler secret put BOT_USERNAME
#   npx wrangler secret put GEMINI_KEY
